name: CI

# CI economics: PR as the independent proof — no duplicate post-merge push run.
# See ai/shared/AGENTS.md → "CI economics" and projects/templates/github-workflows.
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension/manifest.json
        run: |
          echo "Validating extension/manifest.json..."
          jq empty extension/manifest.json
          echo "✓ extension/manifest.json is valid JSON"

      - name: Check JS syntax
        run: |
          echo "Checking JavaScript syntax in extension/..."
          for f in extension/*.js; do
            node --check "$f" && echo "✓ $f"
          done

      - name: Check required icons
        run: |
          for size in 16 32 48 128; do
            test -f "extension/icons/icon${size}.png" && echo "✓ icon${size}.png"
          done
